name: Build Cyber Browser (Windows portable)

on:
  push:
    paths:
      - "cyber_browser/**"
      - ".github/workflows/build-cyber-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cyber_browser/requirements.txt pyinstaller pytest

      - name: Unit tests
        run: python -m pytest cyber_browser/tests -q

      - name: Download Tor Expert Bundle
        run: python cyber_browser/packaging/fetch_tor.py build/tor_bundle

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name CyberBrowser
          --paths .
          --add-data "cyber_browser/translate/translate_page.js;cyber_browser/translate"
          --add-data "build/tor_bundle;tor_bundle"
          --collect-data langdetect
          --collect-submodules cyber_browser
          cyber_browser/packaging/launch.py

      - name: Check the build
        shell: pwsh
        run: |
          if (-not (Test-Path dist/CyberBrowser/CyberBrowser.exe)) { throw "exe missing" }
          $tor = Get-ChildItem -Recurse dist/CyberBrowser -Filter tor.exe | Select-Object -First 1
          if (-not $tor) { throw "bundled tor.exe missing" }
          & $tor.FullName --version
          # Really start the packaged app: Qt WebEngine must load and the bundled Tor must answer.
          $report = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process dist/CyberBrowser/CyberBrowser.exe -ArgumentList "--self-test", $report -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "self-test timed out" }
          if (-not (Test-Path $report)) { throw "self-test crashed (exit $($p.ExitCode)) - no report" }
          Get-Content $report
          $text = Get-Content $report -Raw
          if ($text -notmatch "webengine_ok=True") { throw "Qt WebEngine failed to start" }
          if ($text -notmatch "tor_socks=True") { throw "bundled Tor did not start" }
          Copy-Item cyber_browser/README.md dist/CyberBrowser/README.md

      - name: Network test through real Tor (.onion)
        continue-on-error: true
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP\nettest.txt"
          $p = Start-Process dist/CyberBrowser/CyberBrowser.exe -ArgumentList "--network-test", $report -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); throw "network test timed out" }
          if (-not (Test-Path $report)) { throw "network test crashed (exit $($p.ExitCode))" }
          Get-Content $report
          $log = Get-ChildItem -Recurse $env:APPDATA/CyberBrowser -Filter tor.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName -Tail 25 }
          if ((Get-Content $report -Raw) -notmatch "\.onion/ -> OK") { throw "no .onion site loaded" }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: CyberBrowser-Windows-portable
          path: dist/CyberBrowser
          retention-days: 30
